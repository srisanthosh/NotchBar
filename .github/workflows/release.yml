# Publishes a release when a version tag such as v1.0.0 is pushed. The app is built
# here from the tagged source, so anyone can see exactly what the download contains.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Info.plist says $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build the app
        run: ./build.sh

      - name: Zip the app
        run: |
          ditto -c -k --keepParent build/NotchBar.app "NotchBar-$GITHUB_REF_NAME.zip"
          shasum -a 256 "NotchBar-$GITHUB_REF_NAME.zip" > "NotchBar-$GITHUB_REF_NAME.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "NotchBar-$GITHUB_REF_NAME.zip" "NotchBar-$GITHUB_REF_NAME.zip.sha256" \
            --title "NotchBar $GITHUB_REF_NAME" --verify-tag "$@"
