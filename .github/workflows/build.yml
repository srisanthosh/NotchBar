# Builds NotchBar on every pull request and every push to main, and renders the
# snapshot screenshots so reviewers can see UI changes without building it.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run that's still going.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and snapshot
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Build the app
        run: ./build.sh

      - name: Render snapshots
        run: .build/release/NotchBar --snapshot snapshots
        timeout-minutes: 5

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png
          retention-days: 14
